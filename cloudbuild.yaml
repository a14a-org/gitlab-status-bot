steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gitlab-status-bot:$COMMIT_SHA', '.']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gitlab-status-bot:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'gitlab-status-bot'
    - '--image=gcr.io/$PROJECT_ID/gitlab-status-bot:$COMMIT_SHA'
    - '--region=europe-west4'
    - '--platform=managed'
    - '--allow-unauthenticated'
    - '--port=3000'
    # Socket Mode holds a persistent WebSocket, which combined with
    # --no-cpu-throttling keeps the instance alive continuously (measured: 24
    # billable instance-hours per day). min-instances=1 therefore costs nothing
    # extra here and closes the few-second gap while a recycled instance
    # restarts, during which no socket is connected.
    - '--min-instances=1'
    # The render queue debounces updates in process, so a second instance would
    # duplicate Slack calls. Scale-out would need a shared lock first.
    - '--max-instances=1'
    # Required for the WebSocket to survive between requests.
    - '--no-cpu-throttling'
    - '--concurrency=80'
    - '--cpu=1'
    - '--memory=512Mi'
    - '--timeout=300'
    - '--set-env-vars=NODE_ENV=production'

# Store the built image
images:
- 'gcr.io/$PROJECT_ID/gitlab-status-bot:$COMMIT_SHA'

# Specify build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Faster builds
